# Ideally we'd use Dependabot for this, but Dependabot doesn't (currently)
# support flake updates that include private GitHub repos.
name: Update flake inputs

on:
  schedule:
    - cron: "48 23 * * 6" # Weekly, randomly chosen
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.CI_REPO_ACCESS_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Switch to update branch
        run: |
          if git fetch origin flake-update; then
            git switch flake-update
          else
            git switch -c flake-update
          fi

      - name: Update flake inputs
        id: update
        run: |
          before="$(git rev-parse HEAD)"
          nix flake update --commit-lock-file
          after="$(git rev-parse HEAD)"
          if [[ "$before" != "$after" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.update.outputs.changed == 'true'
        run: git push --force-with-lease origin flake-update

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mapfile -t open_prs < <(gh pr list --head flake-update --json number --jq '.[].number')
          wait "$!"

          if (( ${#open_prs[*]} == 0 )); then
            gh pr create \
              --title 'flake: update flake inputs' \
              --body 'Automated weekly update of flake inputs via `nix flake update --commit-lock-file`.' \
              --base "$TARGET_BRANCH" \
              --head flake-update
          elif (( ${#open_prs[*]} == 1 )); then
            echo "::warning title=PR already exists::No new PR created as $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/${open_prs[0]} already exists"
          else
            echo "::error title=Multiple conflicting PRs exist::Multiple pull requests seem to exist for the flake-update branch: ${open_prs[*]}"
            exit 76
          fi
