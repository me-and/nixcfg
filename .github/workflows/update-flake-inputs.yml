# Ideally we'd use Dependabot for this, but Dependabot doesn't (currently)
# support flake updates that include private GitHub repos.
name: Update flake inputs

on:
  schedule:
    - cron: "48 23 * * 6" # Weekly, randomly chosen
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    outputs:
      nixpkgs_before_rev: ${{ steps.update.outputs.nixpkgs_before_rev }}
      nixpkgs_before_time: ${{ steps.update.outputs.nixpkgs_before_time }}
      nixpkgs_after_rev: ${{ steps.update.outputs.nixpkgs_after_rev }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up keys
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" | sudo sh -c 'umask 0077 && tee /root/.ssh/id_ed25519' >/dev/null

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | sh -c 'umask 0077 && tee ~/.ssh/id_ed25519' >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.CI_REPO_ACCESS_TOKEN }}
          extra_nix_config: |
            extra-trusted-public-keys = ${{ vars.NIX_EXTRA_TRUSTED_PUBLIC_KEYS }}

      - name: Set substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ vars.NIX_EXTRA_SUBSTITUTERS }}
        run: |
          available_substituters=()
          for s in $NIX_EXTRA_SUBSTITUTERS; do
              if nix store info --store "$s"; then
                  available_substituters+=("$s")
              fi
          done

          if (( "${#available_substituters[*]}" > 0 )); then
              NIX_CONFIG="${NIX_CONFIG:+"$NIX_CONFIG"$'\n'}extra-substituters = ${available_substituters[*]}"
              {
                  echo 'NIX_CONFIG<<EOF'
                  printf '%s\n' "$NIX_CONFIG"
                  echo EOF
              } >>"$GITHUB_ENV"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Switch to update branch
        run: |
          if git fetch origin flake-update; then
            git switch flake-update
          else
            git switch -c flake-update
          fi

      - name: Update flake inputs
        id: update
        run: |
          before="$(git rev-parse HEAD)"
          nixpkgs_before_rev="$(nix flake metadata --json | jq --raw-output '.locks.nodes.nixpkgs.locked.rev')"
          nixpkgs_before_time="$(nix flake metadata --json | jq --raw-output '.locks.nodes.nixpkgs.locked.lastModified')"
          nix flake update --commit-lock-file
          after="$(git rev-parse HEAD)"
          nixpkgs_after_rev="$(nix flake metadata --json | jq --raw-output '.locks.nodes.nixpkgs.locked.rev')"
          if [[ "$before" != "$after" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "nixpkgs_before_rev=$nixpkgs_before_rev" >>"$GITHUB_OUTPUT"
            echo "nixpkgs_before_time=$nixpkgs_before_time" >>"$GITHUB_OUTPUT"
            echo "nixpkgs_after_rev=$nixpkgs_after_rev" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.update.outputs.changed == 'true'
        run: git push --force-with-lease origin flake-update

      - name: Create pull request
        id: create-pr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mapfile -t open_prs < <(gh pr list --head flake-update --json number --jq '.[].number')
          wait "$!"

          if (( ${#open_prs[*]} == 0 )); then
            pr_url="$(gh pr create \
              --title 'flake: update flake inputs' \
              --body 'Automated weekly update of flake inputs via `nix flake update --commit-lock-file`.' \
              --base "$TARGET_BRANCH" \
              --head flake-update)"
            echo "pr_url=$pr_url" >>"$GITHUB_OUTPUT"
            echo "::notice title=PR created::$pr_url"
          elif (( ${#open_prs[*]} == 1 )); then
            echo "::warning title=PR already exists::No new PR created as $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/${open_prs[0]} already exists"
            echo "pr_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/${open_prs[0]}" >>"$GITHUB_OUTPUT"
          else
            echo "::error title=Multiple conflicting PRs exist::Multiple pull requests seem to exist for the flake-update branch: ${open_prs[*]}"
            exit 76
          fi

  add-nixpkgs-relnotes:
    name: Add Nixpkgs release notes
    runs-on: ubuntu-latest
    needs: update
    if: needs.update.outputs.nixpkgs_before_rev != needs.update.outputs.nixpkgs_after_rev

    steps:
      - name: Check out nixpkgs
        env:
          NIXPKGS_BEFORE_TIME: ${{ needs.update.outputs.nixpkgs_before_time }}
          NIXPKGS_AFTER_REV: ${{ needs.update.outputs.nixpkgs_after_rev }}
        run: git clone https://github.com/NixOS/nixpkgs . --bare --revision "$NIXPKGS_AFTER_REV" --shallow-since "$NIXPKGS_BEFORE_TIME"

      - name: Get diffs
        env:
          NIXPKGS_BEFORE_REV: ${{ needs.update.outputs.nixpkgs_before_rev }}
          NIXPKGS_AFTER_REV: ${{ needs.update.outputs.nixpkgs_after_rev }}
        run: |
          git diff "$NIXPKGS_BEFORE_REV" "$NIXPKGS_AFTER_REV" -- doc/release-notes >nixpkgs-relnotes.diff
          git diff "$NIXPKGS_BEFORE_REV" "$NIXPKGS_AFTER_REV" -- nixos/doc/manual/release-notes >nixos-relnotes.diff

      - name: Update PR
        env:
          NIXPKGS_BEFORE_REV: ${{ needs.update.outputs.nixpkgs_before_rev }}
          NIXPKGS_AFTER_REV: ${{ needs.update.outputs.nixpkgs_after_rev }}
          PR_URL: ${{ needs.update.outputs.pr_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -s nixpkgs-relnotes.diff ]]; then
            echo '## Nixpkgs release notes diff'
            echo
            echo '```diff'
            cat nixpkgs-relnotes.diff
            echo '```'
          fi >>pr-comment.md

          if [[ -s nixos-relnotes.diff ]]; then
            [[ -s pr-comment.md ]] && echo
            echo '## NixOS release notes diff'
            echo
            echo '```diff'
            cat nixos-relnotes.diff
            echo '```'
          fi >>pr-comment.md

          if [[ -s pr-comment.md ]]; then
            gh pr comment "$PR_URL" --body-file pr-comment.md
          fi
