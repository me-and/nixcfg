name: Update packages

on:
  schedule:
    - cron: "31 14 * * 0" # Weekly, randomly chosen
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up keys
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" | sudo sh -c 'umask 0077 && tee /root/.ssh/id_ed25519' >/dev/null

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | sh -c 'umask 0077 && tee ~/.ssh/id_ed25519' >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # TODO Remove the need for package updates to need access to my
          # private repositories.
          github_access_token: ${{ secrets.CI_REPO_ACCESS_TOKEN }}
          extra_nix_config: |
            extra-trusted-public-keys = ${{ vars.NIX_EXTRA_TRUSTED_PUBLIC_KEYS }}

      # Sometimes a substituter is offline.  That shouldn't cause the builds to
      # fail.
      - name: Set substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ vars.NIX_EXTRA_SUBSTITUTERS }}
        run: |
          available_substituters=()
          for s in $NIX_EXTRA_SUBSTITUTERS; do
              if nix store info --store "$s"; then
                  available_substituters+=("$s")
              fi
          done

          if (( "${#available_substituters[*]}" > 0 )); then
              NIX_CONFIG="${NIX_CONFIG:+"$NIX_CONFIG"$'\n'}extra-substituters = ${available_substituters[*]}"
              {
                  echo 'NIX_CONFIG<<EOF'
                  printf '%s\n' "$NIX_CONFIG"
                  echo EOF
              } >>"$GITHUB_ENV"
          fi

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#nix-update-packages -- --push --pr --use-local
